version: "3.8"

services:
  app:
    container_name: roominar-app
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspace:cached
    ports:
      - 8000:8000
      - 3000:3000
    command: sleep infinity
    depends_on:
      - db
    env_file:
      - ../backend/.env

  db:
    container_name: roominar-db
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-test:
    container_name: roominar-db-test
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.postgres
    restart: unless-stopped
    volumes:
      - postgres-data-test:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  stripe:
    image: stripe/stripe-cli
    container_name: stripe-cli
    command: listen --forward-to http://app:8000/api/v1/transactions/webhook
    depends_on:
      - app
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_DEVICE_NAME=${STRIPE_DEVICE_NAME}

  redis:
    image: redis:latest
    container_name: roominar-redis
    ports:
      - 6379:6379

  celery_worker:
    container_name: roominar-celery
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: roominar-celery
    working_dir: /workspace/Roominar
    command: poetry run celery -A backend.celery worker --loglevel=info
    volumes:
      - ../..:/workspace:cached
    depends_on:
      - app
      - redis
    restart: unless-stopped

  celery_beat:
    container_name: roominar-celery-beat
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: roominar-celery-beat
    working_dir: /workspace/Roominar
    command: poetry run celery -A backend.celery beat --loglevel=info
    volumes:
      - ../..:/workspace:cached
    depends_on:
      - app
      - redis
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-data-test:

networks:
  default:
    name: roominar-network
