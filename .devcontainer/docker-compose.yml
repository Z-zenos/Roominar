services:
  app:
    container_name: roominar-app
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspace:cached
    ports:
      - 2001:2001 # Backend (uvicorn, FastAPI...)
      - 2002:2002 # Frontend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ../backend/.env

  db:
    image: postgres:latest
    container_name: roominar-db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 2003:5432 # đổi từ 5432

  stripe:
    image: stripe/stripe-cli
    container_name: stripe-cli
    command: listen --forward-to http://app:2001/api/v1/transactions/webhook # đổi từ 8000
    depends_on:
      - app
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_DEVICE_NAME=${STRIPE_DEVICE_NAME}

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: roominar-kafka
    ports:
      - 2004:9092 # đổi từ 9092
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: roominar-zookeeper
    ports:
      - 2005:2181 # đổi từ 2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  redis:
    image: redis:latest
    container_name: roominar-redis
    ports:
      - 2006:6379 # đổi từ 6379

  celery_worker:
    container_name: roominar-celery
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: roominar-celery
    working_dir: /workspace/Roominar
    command: poetry run celery -A backend.celery worker --loglevel=info
    volumes:
      - ../..:/workspace:cached
    depends_on:
      - app
      - redis
    restart: unless-stopped

  celery_beat:
    container_name: roominar-celery-beat
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: roominar-celery-beat
    working_dir: /workspace/Roominar
    command: poetry run celery -A backend.celery beat --loglevel=info
    volumes:
      - ../..:/workspace:cached
    depends_on:
      - app
      - redis
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  default:
    name: roominar-network
