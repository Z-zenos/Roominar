version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prd
    container_name: roominar-backend
    command: poetry run uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.prd
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prd
    container_name: roominar-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.prd
    environment:
      - NEXT_PUBLIC_API_URL=https://api.vievent.site
    depends_on:
      - backend
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.postgres.prd
    container_name: roominar-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: postgres -c listen_addresses='*' -c password_encryption=md5

  redis:
    image: redis:7
    container_name: roominar-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prd
    container_name: roominar-celery
    command: poetry run celery -A backend.celery:app worker --loglevel=info
    env_file:
      - ./backend/.env.prd
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prd
    container_name: roominar-celery-beat
    command: poetry run celery -A backend.celery:app beat --loglevel=info
    env_file:
      - ./backend/.env.prd
    depends_on:
      - backend
      - redis
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  default:
    name: roominar-network
